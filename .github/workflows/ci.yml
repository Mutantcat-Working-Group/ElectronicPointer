# Runs on every push and pull request: builds the solution on all three desktop hosts,
# runs the test suite, publishes every shipping runtime and packages it into the artifacts
# a user downloads, so the deb, the AppImage, the dmg and the NSIS installer are all proven
# here rather than by hand. A payload whose architecture the host cannot run is still
# published and packaged; only the smoke step skips it.
name: CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The packaging scripts are the part a Windows workstation cannot exercise, so they get
  # their own cheap job that parses them on Linux before anything else runs.
  lint:
    name: lint packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: parse the shell scripts
        run: |
          set -euo pipefail
          for script in \
            packaging/linux/package.sh \
            packaging/macos/package.sh \
            packaging/linux/appimage/AppRun \
            packaging/linux/debian/postinst \
            packaging/linux/debian/prerm
          do
            bash -n "$script"
            echo "parsed $script"
          done

      - name: shellcheck
        run: |
          shellcheck -S error \
            packaging/linux/package.sh \
            packaging/macos/package.sh \
            packaging/linux/appimage/AppRun \
            packaging/linux/debian/postinst \
            packaging/linux/debian/prerm

      - name: parse the powershell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem -Path packaging -Filter *.ps1 -Recurse) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
                $script.FullName, [ref] $null, [ref] $errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "$($script.FullName):"
              foreach ($error in $errors) {
                Write-Host "  line $($error.Extent.StartLineNumber): $($error.Message)"
              }
            }
            else {
              Write-Host "parsed $($script.FullName)"
            }
          }
          if ($failed) { throw 'one or more scripts did not parse' }

      # publish.ps1 takes no channel argument any more: one build, one install. A call site
      # that still passes one fails before anything else can catch it, and the grep covers
      # the docs as well, so the flag cannot come back half documented.
      - name: check the packaging contract
        run: |
          set -euo pipefail
          # Matches the argument form a call site passes, not the word in a comment.
          if grep -rnE -- '-Channel[[:space:]]' .github packaging; then
            echo "::error::publish.ps1 takes no channel argument; drop it from every call site and doc"
            exit 1
          fi
          # The installer has one target for all three payloads, and stock NSIS only ships a
          # stub for that target. A move to amd64-unicode or arm64-unicode would break the
          # windows job below, which installs the stock NSIS package and no other stub source.
          grep -rn -- '^Target ' packaging/windows/installer.nsi
          grep -q 'Target x86-unicode' packaging/windows/installer.nsi || {
            echo "::error::installer.nsi must keep the x86-unicode target, see the comment there"
            exit 1
          }

  build:
    name: build and test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every runner publishes its own architecture and packages it there, because that
          # is also the only place those runtime-specific packages can be built. The two
          # payloads the host has no hardware for - win-arm64 on an x64 runner, osx-x64 on
          # an arm64 runner without Rosetta - carry an empty executable: they are still
          # published, packaged and confirmed, the smoke step is the only one that skips
          # them. win-x86 does launch on x64 Windows through WoW64, so it keeps its smoke.
          - os: windows-latest
            rid: win-x64
            executable: ElectronicPointer.exe
          - os: windows-latest
            rid: win-x86
            executable: ElectronicPointer.exe
          - os: windows-latest
            rid: win-arm64
            executable: ''
          - os: ubuntu-latest
            rid: linux-x64
            executable: ElectronicPointer
          - os: macos-latest
            rid: osx-arm64
            executable: ElectronicPointer
          - os: macos-latest
            rid: osx-x64
            executable: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: restore
        run: dotnet restore ElectronicPointer.sln

      - name: build
        run: dotnet build ElectronicPointer.sln --configuration Release --no-restore --nologo

      # The solution has no platform-specific test project that needs a display: Core and
      # Rendering are pure logic plus Skia, and Platform.Linux exercises the X11 key mapping
      # and the autostart entry writer without opening a connection.
      - name: test
        run: dotnet test ElectronicPointer.sln --configuration Release --no-build --nologo

      # No DateStamp is passed on purpose: the stamp is only meaningful once a tag fixes it,
      # and CI wants the same "today" build a developer gets locally.
      - name: publish the ${{ matrix.rid }} payload
        run: |
          pwsh packaging/publish.ps1 -Rid ${{ matrix.rid }}

      # The hosted Windows image ships no NSIS at all, and makensis is the whole installer,
      # so the stock package goes in before packaging. nsis is a meta package: nsis.install
      # does the work and lands in Program Files or Program Files (x86) depending on the
      # installer version, so whichever of the two actually has makensis.exe in it is the
      # folder taken, which is exactly what Find-Nsis in package.ps1 looks at. The folder
      # joins PATH as well, so any later step could call makensis directly too.
      - name: install nsis
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress --no-color
          $nsis = $null
          foreach ($candidate in @(
              (Join-Path $env:ProgramFiles 'NSIS'),
              (Join-Path ${env:ProgramFiles(x86)} 'NSIS'))) {
            if (Test-Path -LiteralPath (Join-Path $candidate 'makensis.exe')) {
              $nsis = $candidate
              break
            }
          }
          if (-not $nsis) {
            throw 'choco installed NSIS but no makensis.exe turned up in the well known folders'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          Write-Host "makensis at $nsis"
          Get-ChildItem -LiteralPath (Join-Path $nsis 'Stubs') -Filter '*x86-unicode*' -File |
            ForEach-Object { Write-Host "stub $($_.Name)" }

      # package.ps1 is the half of the chain that only a Windows host can run, so the Windows
      # leg exercises it here over the payload it just published: the portable zip, the MSIX
      # and the NSIS installer all come out of that one script and a broken step in it fails
      # the job. The self-signed certificate the script mints when no .pfx is handed over is
      # kept, because signing is part of what ships, and the artifacts themselves are not
      # uploaded, the exit code is the whole point.
      - name: package the windows payload
        if: runner.os == 'Windows'
        run: pwsh packaging/windows/package.ps1 -Rid ${{ matrix.rid }}

      - name: confirm the windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat "artifacts/out/${{ matrix.rid }}/buildstamp.txt")
          for name in \
            "ElectronicPointer-$version-${{ matrix.rid }}.zip" \
            "ElectronicPointer-$version-${{ matrix.rid }}.msix" \
            "ElectronicPointer-$version-${{ matrix.rid }}-setup.exe"
          do
            if [ ! -f "artifacts/dist/$name" ]; then
              echo "::error::missing artifacts/dist/$name"
              ls -l artifacts/dist || true
              exit 1
            fi
            echo "built $name ($(du -h "artifacts/dist/$name" | cut -f1))"
          done

      # package.sh is the Linux half of the chain, and it never ran anywhere before this
      # job: the lint job only parses it. The deb, the AppImage and the portable tarball all
      # come out of that one script and a broken step in it fails the build instead of a
      # release. appimagetool is downloaded and then extracted rather than mounted, because
      # the runner has no FUSE device, and the tool brings its own mksquashfs, so squashfs
      # tools never have to be installed.
      - name: package the linux payload
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh ${{ matrix.rid }}

      # All three names are derived from the same buildstamp the scripts read, so a missing
      # artifact here means the script skipped a step, not a renamed one.
      - name: confirm the linux artifacts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version=$(cat "artifacts/out/${{ matrix.rid }}/buildstamp.txt")
          for name in \
            "electronicpointer-$version-${{ matrix.rid }}.tar.gz" \
            "electronicpointer_${version}_amd64.deb" \
            "ElectronicPointer-$version-x86_64.AppImage"
          do
            if [ ! -f "artifacts/dist/$name" ]; then
              echo "::error::missing artifacts/dist/$name"
              ls -l artifacts/dist || true
              exit 1
            fi
            echo "built $name ($(du -h "artifacts/dist/$name" | cut -f1))"
          done

      # The AppImage is the one artifact nothing can run straight from a runner, because a
      # mount needs a FUSE device, so it is extracted the way appimagetool extracted itself
      # and its own entry point is launched afterwards. That exercises the AppRun launcher,
      # the relative link into the payload and the native libraries in one go, which is
      # what the AppImage is actually worth.
      - name: launch the packaged appimage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version=$(cat "artifacts/out/${{ matrix.rid }}/buildstamp.txt")
          appimage="$GITHUB_WORKSPACE/artifacts/dist/ElectronicPointer-$version-x86_64.AppImage"
          chmod +x "$appimage"
          work="$RUNNER_TEMP/appimage-check"
          rm -rf "$work"
          mkdir -p "$work"
          (
            cd "$work" || exit 1
            "$appimage" --appimage-extract >/dev/null
            ./squashfs-root/AppRun --version
          )

      # package.sh is the macOS half: the .app bundle, the icns derived from the root
      # icon.png, the ad-hoc seal the runner can give (no developer certificate exists
      # there) and the dmg with the Applications drop link staged inside, sealed as well.
      # Like the Linux script it never ran anywhere before this job.
      - name: package the macos payload
        if: runner.os == 'macOS'
        run: bash packaging/macos/package.sh ${{ matrix.rid }}

      # The dmg is what a user downloads, so it is mounted and read back here: the volume
      # has to carry the Applications drop link, the bundle inside has to prove the ad-hoc
      # signature the script claims, and on the architecture the runner can launch the
      # bundled executable still answers --version.
      - name: confirm the macos artifacts
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version=$(cat "artifacts/out/${{ matrix.rid }}/buildstamp.txt")
          dmg="artifacts/dist/ElectronicPointer-$version-${{ matrix.rid }}.dmg"
          if [ ! -f "$dmg" ]; then
            echo "::error::missing $dmg"
            ls -l artifacts/dist || true
            exit 1
          fi
          echo "built $dmg ($(du -h "$dmg" | cut -f1))"
          plist="$RUNNER_TEMP/ep-attach.plist"
          hdiutil attach -nobrowse -plist "$dmg" > "$plist"
          mountpoint="$(/usr/libexec/PlistBuddy \
            -c 'Print :system-entities:0:mount-point' "$plist")"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true' EXIT
          echo "mounted $dmg at $mountpoint"
          if [ ! -L "$mountpoint/Applications" ]; then
            echo "::error::the volume has no Applications drop link"
            exit 1
          fi
          echo "the drop link points at $(readlink "$mountpoint/Applications")"
          codesign -dv --verbose=1 "$mountpoint/ElectronicPointer.app" 2>&1 |
            grep -q 'Signature=adhoc'
          echo "the bundle inside the image carries the ad-hoc signature"
          if [ -n '${{ matrix.executable }}' ]; then
            "$mountpoint/ElectronicPointer.app/Contents/MacOS/${{ matrix.executable }}" --version
          fi
          hdiutil detach "$mountpoint"
          trap - EXIT

      # --version is answered before Avalonia starts, so this needs no display, no X11 and
      # no WindowServer, yet it still proves the native libraries resolved and the apphost
      # is executable.
      - name: smoke
        if: matrix.executable != ''
        run: artifacts/out/${{ matrix.rid }}/${{ matrix.executable }} --version

      - name: record the payload summary
        shell: bash
        run: |
          {
            echo '# ${{ matrix.rid }} published payload'
            echo
            if [ -n '${{ matrix.executable }}' ]; then
              artifacts/out/${{ matrix.rid }}/${{ matrix.executable }} --version
            else
              echo '(published and packaged without launching: the host has no hardware for this runtime)'
            fi
            echo
            echo "$(find artifacts/out/${{ matrix.rid }} -type f | wc -l) files, $(du -sh artifacts/out/${{ matrix.rid }} | cut -f1)"
          } > smoke.txt

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.rid }}
          path: smoke.txt
          if-no-files-found: error
